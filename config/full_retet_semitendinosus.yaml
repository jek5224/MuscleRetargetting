surface_reconstruction:
  path: explicit_reference
  implicit_fallback_enabled: false
  implicit_pitch_m: 0.00075
  maximum_global_deviation_m: 0.006
  maximum_contact_deviation_m: 0.001
  maximum_contact_normal_deviation_degrees: 15.0
